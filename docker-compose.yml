version: "3.9"

services:
  # One-shot scraper — triggered externally (cloud scheduler, K8s CronJob, etc.)
  scraper:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    volumes:
      - ./output:/app/output
    restart: "no"

  # Self-scheduling scraper — runs cron inside the container (hourly)
  scraper-cron:
    build:
      context: .
      dockerfile: Dockerfile.cron
    env_file: .env
    volumes:
      - ./output:/app/output
    restart: unless-stopped
